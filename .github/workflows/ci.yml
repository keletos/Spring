name: Build and test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: Spring_CP_RED_TEST
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d Spring_CP_RED_TEST"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate ephemeral RSA keys for tests
        run: |
          mkdir -p "$RUNNER_TEMP/jwt"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt/private.pem"
          openssl pkey -in "$RUNNER_TEMP/jwt/private.pem" -pubout -out "$RUNNER_TEMP/jwt/public.pem"

      - name: Verify Maven project
        working-directory: course-project
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
        env:
          DB_PASSWORD: postgres
          SPRING_PROFILES_ACTIVE: test
          JWT_PRIVATE_KEY_PATH: ${{ runner.temp }}/jwt/private.pem
          JWT_PUBLIC_KEY_PATH: ${{ runner.temp }}/jwt/public.pem
