spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Spring_CP_RED_DEV
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
   
  flyway:
    enabled: true

  data:
    web:
      pageable:
        max-page-size: 100

logging:
  level:
    org.hibernate.SQL: DEBUG

app:
  messaging:
    kafka:
      enabled: false