spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Spring_CP_RED_TEST
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true

  kafka:
    admin:
      auto-create: false
    listener:
      auto-startup: false

  data:
    web:
      pageable:
        max-page-size: 100

app:
  messaging:
    kafka:
      enabled: false
