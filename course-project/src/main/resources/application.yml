spring:
  profiles:
    default: dev

  mvc:
    problemdetails:
      enabled: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.key.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.value.default.type]": kz.kbtu.course_project.domain.event.CharacterCreatedEvent
        "[spring.json.use.type.headers]": false
        "[spring.json.trusted.packages]": kz.kbtu.course_project.domain.event
    listener:
      ack-mode: record

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

integrations:
  github:
    base-url: https://api.github.com
    compendium-path: /repos/DankTrain11949/CyberPunk-Red-Fan-Compendium
    compendium-url: https://github.com/DankTrain11949/CyberPunk-Red-Fan-Compendium
    connect-timeout: 2s
    read-timeout: 3s

app:
  messaging:
    kafka:
      enabled: true
    outbox:
      poll-interval: 1000
